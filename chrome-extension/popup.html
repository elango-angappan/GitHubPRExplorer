<!DOCTYPE html>
<html>
<head>
  <title>GitHub PR Explorer</title>
  <style>
    :root {
      --primary-bg: #181a20;
      --card-bg: #23262f;
      --primary-text: #fff;
      --secondary-text: #b0b4be;
      --accent: #2da44e;
      --border: #23262f;
      --toggle-bg: #23262f;
      --toggle-checked: #2da44e;
      --toggle-unchecked: #444857;
      --button-bg: #2da44e;
      --button-hover: #238636;
      --button-text: #fff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --primary-bg: #f6f8fa;
        --card-bg: #fff;
        --primary-text: #24292f;
        --secondary-text: #57606a;
        --accent: #2da44e;
        --border: #e1e4e8;
        --toggle-bg: #e1e4e8;
        --toggle-checked: #2da44e;
        --toggle-unchecked: #b0b4be;
        --button-bg: #2da44e;
        --button-hover: #218838;
        --button-text: #fff;
      }
    }
    body {
      background: var(--primary-bg);
      color: var(--primary-text);
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-width: 340px;
      padding: 0;
      padding-bottom: 16px;
    }
    .header {
      font-size: 1.2em;
      font-weight: 600;
      padding: 20px 24px 8px 24px;
      background: var(--primary-bg);
      color: var(--primary-text);
      border-bottom: 1px solid var(--border);
    }
    .section {
      background: var(--card-bg);
      border-radius: 12px;
      margin: 18px 16px 0 16px;
      padding: 12px 18px 10px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .divider {
      width: 100%;
      height: 1px;
      background: #353945;
      margin: 12px 0 12px 0;
      border-radius: 1px;
      transition: opacity 0.2s;
    }
    .divider.hide {
      display: none !important;
    }
    .toggle-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .toggle-row:last-child {
      border-bottom: none;
    }
    .toggle-icon {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin-right: 12px;
      margin-top: 2px;
    }
    .toggle-labels {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .toggle-title {
      font-size: 1em;
      font-weight: 500;
      color: var(--primary-text);
      margin-bottom: 4px;
    }
    .toggle-desc {
      font-size: 0.85em;
      color: var(--secondary-text);
      line-height: 1.3;
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 24px;
      cursor: pointer;
      margin-top: 2px;
      align-self: flex-start;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--toggle-unchecked);
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      border-radius: 50%;
      transition: .4s;
    }
    input:checked + .slider {
      background-color: var(--toggle-checked);
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .reload-btn {
      width: 100%;
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .reload-btn:hover {
      background: var(--button-hover);
    }
    .toast {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #23262f;
      color: #fff;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 1em;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="header">GitHub PR Explorer</div>
  <div class="section">
    <div class="meta" id="pr-meta">Loading PR info...</div>
  </div>
  <div class="section" id="section-counts" style="display: none;">
    <div class="counts" id="file-counts"></div>
  </div>
  <div class="section">
    <div class="toggle-row">
      <div class="toggle-icon">
        <!-- Eye SVG -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 12C2.73 7.61 7.11 4.5 12 4.5C16.89 4.5 21.27 7.61 23 12C21.27 16.39 16.89 19.5 12 19.5C7.11 19.5 2.73 16.39 1 12Z" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <div class="toggle-labels">
        <span class="toggle-title">Mark all as viewed</span>
        <span class="toggle-desc">Mark all visible PR files as viewed in GitHub.</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="mark-all">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <div class="toggle-icon">
        <!-- Cross SVG -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M8 8L16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 8L8 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="toggle-labels">
        <span class="toggle-title">Mark all as unviewed</span>
        <span class="toggle-desc">Unmark all visible PR files as viewed in GitHub.</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="unmark-all">
        <span class="slider"></span>
      </label>
    </div>
    <button class="reload-btn" id="reload-btn">Reload PR Page</button>
  </div>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
